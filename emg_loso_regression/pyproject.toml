[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-loso-regression"
version = "0.1.0"
description = "Hardware-Aware Personalized HD-sEMG Continuous Joint-Angle Regression under LOSO Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
